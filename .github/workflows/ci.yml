name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.15"]  # oldest and newest supported
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile scripts/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: No secrets committed
        run: python scripts/secret_scanner.py .

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Scripts parse
        run: for f in site/*.js site-tests/*.js tools/*.js; do node --check "$f"; done
      - name: Site data is complete and well formed
        run: node site-tests/check_site_data.js
      - name: Playground scenarios start broken and the fixes solve them
        run: node site-tests/check_playground.js
      - name: Script X-ray
        run: node site-tests/check_xray.js
      - name: problems.html is in sync with the data
        run: node site-tests/check_problems.js
      - name: Fuzz the evaluator and the X-ray
        run: node site-tests/fuzz.js 6000
